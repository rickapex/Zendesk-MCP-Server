steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/zendesk-mcp-http:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/zendesk-mcp-http:$SHORT_SHA'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/zendesk-mcp-http'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'zendesk-mcp-http'
      - '--image=gcr.io/$PROJECT_ID/zendesk-mcp-http:$SHORT_SHA'
      - '--region=us-central1'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--timeout=3600'
      - '--allow-unauthenticated'
      - '--set-env-vars=ZENDESK_URL=https://afsit1686145325.zendesk.com'

images:
  - 'gcr.io/$PROJECT_ID/zendesk-mcp-http:latest'
  - 'gcr.io/$PROJECT_ID/zendesk-mcp-http:$SHORT_SHA'
